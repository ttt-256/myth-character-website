<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神话人物角色选择｜上古纪事</title>

    <!-- 登录门禁：未登录则先跳转 login.html -->
    <script src="js/auth.js"></script>
    <script>if (window.MythoAuth) { window.MythoAuth.require(); }</script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部：退出登录 / 当前用户 / 回首页 -->
<div class="topbar">
    <button class="logout-btn" onclick="logout()">退出登录</button>
    <div class="topbar-right">
        <span id="userInfo"></span>
        <a class="home-link" href="index.html">首页</a>
    </div>
</div>

<div class="container">

    <div class="page-head">
        <h1>上古纪事</h1>
        <p>择一人 · 入一卷山海</p>
    </div>

    <!-- 六张角色卡片由 js/select.js 生成，顺序即是这里的数组顺序 -->
    <div class="grid-layout" id="characters-grid"></div>

    <p class="footer-tip">✦ 点击人物，开启专属故事 ✦</p>

</div>

<script src="select.js"></script>
</body>
</html>
